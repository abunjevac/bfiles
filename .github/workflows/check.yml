name: Check

on:
  push:
  pull_request:

# a newer push to the same ref makes the running check obsolete
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Verify go.mod and go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          args: --allow-parallel-runners --timeout 10m

      - name: go vet
        run: go vet ./...

      - name: go test (race detector)
        run: go test -count=1 -race ./...

      - name: Install osv-scanner
        run: go install github.com/google/osv-scanner/cmd/osv-scanner@v1.9.2

      - name: osv-scanner
        run: osv-scanner -r .
